[project]
name = "actionproof"
version = "0.1.0"
description = "Proof before permission: an evidence-verified safety gate for AI agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "mcp",
  "pdfplumber",
  "pymupdf",
  "pytesseract",
  "pynacl",
  "rfc8785",
  "psycopg[binary]",
  "langchain-core",
  "httpx",
  "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["infra: needs docker compose services (postgres, opa)"]
