# Render blueprint: everything on free tiers. Secrets are generated by Render (never in git).
# Free Postgres expires ~30 days after creation; free web services sleep when idle (cold start ~30-60s).
databases:
  - name: actionproof-db
    plan: free
    databaseName: actionproof
    user: actionproof

services:
  # Policy engine. Public URL on free hosting, so docker/opa/authz.rego allows only the decision query + /health.
  - type: web
    name: actionproof-opa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.opa
    healthCheckPath: /health
    envVars:
      - { key: PORT, value: "8181" }

  - type: web
    name: actionproof-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: actionproof-db, property: connectionString } }
      - { key: OPA_URL, value: https://actionproof-opa.onrender.com }
      # fail closed (AP-POL-FAIL) is kept; the timeout only has to survive a warm OPA over the public network.
      - { key: OPA_TIMEOUT_SECONDS, value: "3" }
      - { key: SIGNING_KEY_B64, generateValue: true }
      - { key: SIGNING_KEY_PATH, value: /tmp/signing.key }
      - { key: SIGNING_KID, value: k1 }
      - { key: APPLY_SCHEMA, value: "1" }
      - { key: DOCS_DIR, value: /app/fixtures/out }
      - { key: CONSOLE_PORT, value: "10000" }
      - { key: PORT, value: "10000" }
      - { key: CONSOLE_BIND_HOST, value: 0.0.0.0 }
      - { key: CONSOLE_COOKIE_SECURE, value: "true" }
      - { key: WEB_ORIGIN, value: https://actionproof-web.onrender.com }
      - { key: TESSERACT_CMD, value: /usr/bin/tesseract }

  - type: web
    name: actionproof-web
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - { key: NEXT_PUBLIC_API_BASE, value: /api }
      - { key: CONSOLE_API_ORIGIN, value: https://actionproof-api-ch8h.onrender.com }
      - { key: NEXT_PUBLIC_SITE_URL, value: https://actionproof-web.onrender.com }
      - { key: NEXT_PUBLIC_REPO_URL, value: https://github.com/Physics0070/ActionProof }
