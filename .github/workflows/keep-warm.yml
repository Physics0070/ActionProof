# Free Render services sleep after ~15 min idle; a cold OPA makes the gate fail closed (AP-POL-FAIL).
# Ping OPA (the policy engine) every 10 min during demo hours only: free tier has ~750 instance-hours/month per
# workspace, so 24/7 would use almost all of it. Hours are UTC (04-16 = 09:30-21:30 IST). Edit the cron to move them.
name: keep-warm
on:
  schedule: [{ cron: "*/10 4-15 * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://actionproof-opa.onrender.com/health
