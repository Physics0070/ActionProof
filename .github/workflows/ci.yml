name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway service-container credentials: exist only on the runner for the job's lifetime, protect nothing.
  PG_CI_USER: ci
  PG_CI_PASSWORD: ci-only
  OPA_VERSION: "1.22.2"
  NODE_VERSION: "22"

jobs:
  # Gate 0. Everything else needs this: the two guarantees (G1 re-checkable derivations, G2 no replay) come first.
  usp:
    name: "USP: proof before permission"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: actionproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-only@localhost:5432/actionproof
      OPA_URL: http://127.0.0.1:8181
      TESSERACT_CMD: /usr/bin/tesseract
      SIGNING_KEY_PATH: keys/ci.key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend
        with:
          opa-version: ${{ env.OPA_VERSION }}
      - name: USP suite and red team
        run: uv run pytest tests/usp tests/redteam -v

  lint:
    needs: usp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Python lint = syntax/bytecode check. ruff/other linters need the user's approval first (docs/RUNBOOK.md, CI).
      - run: python -m compileall -q src
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint
        working-directory: web

  typecheck:
    needs: usp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  pytest:
    needs: usp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: actionproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-only@localhost:5432/actionproof
      OPA_URL: http://127.0.0.1:8181
      TESSERACT_CMD: /usr/bin/tesseract
      SIGNING_KEY_PATH: keys/ci.key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend
        with:
          opa-version: ${{ env.OPA_VERSION }}
      - run: uv run pytest -m "not infra" -q

  opa-test:
    needs: usp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - run: opa test policy -v

  web-build:
    needs: usp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE: /api
          CONSOLE_API_ORIGIN: http://127.0.0.1:8766

  # Both browser jobs run against the real compose stack (docker/ci-stack.sh): throwaway key + password, demo seed.
  e2e:
    needs: [usp, lint, typecheck, pytest, opa-test, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:5173
      E2E_MINT_CMD: docker compose -f docker-compose.yml exec -T api python scripts/mint_review.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Stack up (compose, DEMO_SEED=1)
        run: bash docker/ci-stack.sh
      - run: npm ci --ignore-scripts
        working-directory: web
      # Until @playwright/test and @axe-core/playwright are committed to web/package.json (see web/README.md).
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f docker-compose.yml down -v

  lighthouse:
    needs: [usp, lint, typecheck, pytest, opa-test, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Stack up (compose, DEMO_SEED=1)
        run: bash docker/ci-stack.sh
      # CI only: no repo dependency. Budgets live in web/lighthouserc.json.
      # Default preset = mobile emulation + simulated slow 4G (the budget is the mobile LCP < 2.5 s).
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=web/lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200
      - if: always()
        run: docker compose -f docker-compose.yml down -v
