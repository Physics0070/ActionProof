services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-actionproof}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-actionproof-dev}
      POSTGRES_DB: ${PG_DB:-actionproof}
    ports: ["${PG_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-actionproof}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ADR-005: OPA runs as a sidecar next to the gateway.
  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policy"]
    volumes: ["./policy:/policy:ro"]
    ports: ["${OPA_PORT:-8181}:8181"]
